$schema: https://raw.githubusercontent.com/AgentWrapper/agent-orchestrator/main/schema/config.schema.json

# Project-local agent-orchestrator.yaml. Run `ao start` from the repository root
# to register project identity; do not put `path` or `projectId` in this file.
agent: opencode
runtime: process
workspace: worktree
defaultBranch: main

# Load the repository's authoritative entry, then add AO-specific boundaries.
agentRulesFile: AGENTS.md
agentRules: |
  Follow TheMasterplan for every task.

  Before making changes, verify and read:
  - AGENTS.md
  - core/workflow.md
  - core/policy.md
  - profiles/git.md
  - adapters/agent-orchestrator.md

  If any required file is missing, report that TheMasterplan is incomplete
  and stop. Do not silently infer missing rules.

  Each Agent Orchestrator worker owns exactly one Issue, one worktree, one
  task branch, and one Pull Request.

  The worker may implement, test, push its task branch, create or update its
  own Pull Request, and address CI or review feedback within scope.

  The worker must not merge, release, deploy, delete remote resources,
  force-push published history, modify unrelated tasks, or expand scope
  without explicit human approval.

  Run the authoritative validation before every push. Read the complete diff
  before creating or updating the Pull Request. Report failed or unexecuted
  validation truthfully.

opencodeIssueSessionStrategy: reuse

reactions:
  ci-failed:
    auto: true
    action: send-to-agent
    retries: 2

  changes-requested:
    auto: true
    action: send-to-agent
    retries: 2
    escalateAfter: "30m"

  # AO currently treats auto-merge as a reserved merge intent, not a bypass.
  # TheMasterplan retains the human merge gate, so use notify only.
  approved-and-green:
    auto: false
    action: notify
    priority: action
