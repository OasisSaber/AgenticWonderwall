name: Check

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # Required only for checkout; PR data comes from the event payload.

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.7'

      - name: Install YAML validation dependency
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Validate Pull Request body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/validate_pr_body.py

      - name: Check repository with Bash
        run: bash scripts/check.sh
        shell: bash

      - name: Check PowerShell entry
        run: ./scripts/check.ps1
        shell: pwsh

  # 过渡期新检查：相对路径调用当前 PR 内的中央 reusable workflow，
  # 确保 AW 的 PR 测试当前 PR 中的策略实现而不是远端旧版本。
  # 真实 check-run 名称：aw-check / check（与消费者 smoke 仓库一致）。
  # 人类完成 Ruleset required check 迁移后，可单独删除上方旧 check job。
  aw-check:
    uses: ./.github/workflows/aw-check.yml
